<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Emblema de Ecuaciones Diferenciales">
  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041548" />
      <stop offset="100%" stop-color="#132652" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d97e" />
      <stop offset="50%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#9e7815" />
    </linearGradient>
  </defs>

  <!-- Fondo escudo redondeado -->
  <rect x="4" y="4" width="112" height="112" rx="22" fill="url(#bgNavy)" stroke="url(#goldGrad)" stroke-width="5" />
  <rect x="11" y="11" width="98" height="98" rx="16" fill="none" stroke="#c59b27" stroke-width="1.2" stroke-opacity="0.55" />

  <!-- Campo de pendientes (slope field) sutil de fondo -->
  <g stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" opacity="0.28">
    <line x1="20" y1="78" x2="30" y2="70" />
    <line x1="20" y1="54" x2="30" y2="48" />
    <line x1="20" y1="32" x2="30" y2="30" />
    <line x1="45" y1="86" x2="55" y2="76" />
    <line x1="45" y1="36" x2="55" y2="30" />
    <line x1="70" y1="88" x2="80" y2="82" />
    <line x1="70" y1="32" x2="80" y2="26" />
    <line x1="90" y1="76" x2="100" y2="66" />
    <line x1="90" y1="48" x2="100" y2="38" />
  </g>

  <!-- Curva integral / solución de ecuación diferencial -->
  <path d="M 16 88 C 38 86, 48 32, 72 30 C 86 29, 94 42, 104 22"
        fill="none" stroke="#0093ff" stroke-width="3.2" stroke-linecap="round" opacity="0.65" />

  <!-- Símbolo de Integral clásico a la izquierda -->
  <path d="M 39 27
           C 33 27, 30 31, 30 38
           L 30 82
           C 30 89, 27 93, 21 93"
        fill="none" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round" />
  <circle cx="39" cy="27" r="3.2" fill="#f5d97e" />
  <circle cx="21" cy="93" r="3.2" fill="#c59b27" />

  <!-- Notación dy / dx a la derecha -->
  <text x="73" y="51" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="bold" font-size="25"
        fill="#ffffff">dy</text>

  <line x1="48" y1="60" x2="98" y2="60" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

  <text x="73" y="85" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="bold" font-size="25"
        fill="#f5d97e">dx</text>
</svg>
